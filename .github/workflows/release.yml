name: Build & Release APK

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest

    # Required so the job can create GitHub Releases and upload assets
    permissions:
      contents: write

    steps:
      # ── 1. Source ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Java ────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Gradle (includes built-in dependency cache) ────────────────────
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'      # used as fallback if wrapper jar is absent

      # ── 4. Ensure the Gradle wrapper jar exists ───────────────────────────
      # The wrapper .jar is a binary that many teams omit from git.
      # If it is missing we regenerate it here using the standalone Gradle
      # binary installed above; the .properties file pins the exact version.
      - name: Ensure Gradle wrapper jar exists
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "wrapper jar missing – regenerating from gradle-wrapper.properties"
            GRADLE_VER=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties \
              | sed 's/.*gradle-\([0-9.]*\)-bin.zip/\1/')
            gradle wrapper --gradle-version="${GRADLE_VER:-8.7}"
          fi
          chmod +x gradlew

      # ── 5. Keystore ────────────────────────────────────────────────────────
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks

      # ── 6. Build ───────────────────────────────────────────────────────────
      - name: Build signed release APK
        env:
          KEYSTORE_PATH: keystore.jks        # relative to app/ — matches storeFile in build.gradle
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # ── 7. Rename ──────────────────────────────────────────────────────────
      - name: Rename APK to versioned filename
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/TeamMaestroExam-${{ github.ref_name }}.apk"

      # ── 8. GitHub Release ─────────────────────────────────────────────────
      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          name: "Team Maestro Exam ${{ github.ref_name }}"
          generate_release_notes: true
          files: "app/build/outputs/apk/release/TeamMaestroExam-${{ github.ref_name }}.apk"
