name: Build & Release APK

on:
  # Manual trigger — pass release=true + version to publish a GitHub Release
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release with this build?'
        type: boolean
        default: false
      version:
        description: 'Release version (e.g. v1.0.0) — required when release is true'
        type: string
        default: 'v1.0.0'

  # Tag trigger — builds a signed release APK and publishes a GitHub Release
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ensure Gradle wrapper jar exists
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            GRADLE_VER=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties \
              | sed 's/.*gradle-\([0-9.]*\)-bin.zip/\1/')
            gradle wrapper --gradle-version="${GRADLE_VER:-8.7}"
          fi
          chmod +x gradlew

      - name: Resolve build mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ] || \
             [ "${{ github.event.inputs.release }}" = "true" ]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            else
              echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            fi
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      # Debug build (non-release workflow_dispatch only)
      - name: Build debug APK
        if: steps.mode.outputs.is_release == 'false'
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK artifact
        if: steps.mode.outputs.is_release == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: TeamMaestroExam-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # Release build — works with or without production signing secrets.
      # If KEYSTORE_BASE64 is configured, the APK is signed with your production key.
      # Otherwise, a temporary self-signed key is generated automatically.
      - name: Prepare signing keystore
        if: steps.mode.outputs.is_release == 'true'
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks
          else
            keytool -genkeypair -v \
              -keystore app/keystore.jks \
              -alias teammaestro \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=TeamMaestro, OU=Dev, O=TeamMaestro, L=Unknown, ST=Unknown, C=US" \
              -storepass android -keypass android
          fi

      - name: Build signed release APK
        if: steps.mode.outputs.is_release == 'true'
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'teammaestro' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK to versioned filename
        if: steps.mode.outputs.is_release == 'true'
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/TeamMaestroExam-${{ steps.mode.outputs.version }}.apk"

      - name: Create GitHub Release and upload APK
        if: steps.mode.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.mode.outputs.version }}
          name: "Team Maestro Exam ${{ steps.mode.outputs.version }}"
          generate_release_notes: true
          files: "app/build/outputs/apk/release/TeamMaestroExam-${{ steps.mode.outputs.version }}.apk"
