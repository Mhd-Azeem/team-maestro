name: Build & Release APK

on:
  # Manual trigger — builds a debug APK with no signing secrets required
  workflow_dispatch:

  # Tag trigger — builds a signed release APK and publishes a GitHub Release
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ensure Gradle wrapper jar exists
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            GRADLE_VER=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties \
              | sed 's/.*gradle-\([0-9.]*\)-bin.zip/\1/')
            gradle wrapper --gradle-version="${GRADLE_VER:-8.7}"
          fi
          chmod +x gradlew

      # Debug build (workflow_dispatch only, no secrets needed)
      - name: Build debug APK
        if: github.event_name == 'workflow_dispatch'
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: TeamMaestroExam-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # Signed release build (tag push only)
      # Uses production keystore from secrets if available; otherwise generates a
      # temporary self-signed keystore so the release APK is always installable.
      - name: Prepare signing keystore
        if: github.event_name == 'push'
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks
          else
            keytool -genkeypair -v \
              -keystore app/keystore.jks \
              -alias teammaestro \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=TeamMaestro, OU=Dev, O=TeamMaestro, L=Unknown, ST=Unknown, C=US" \
              -storepass android -keypass android
          fi

      - name: Build signed release APK
        if: github.event_name == 'push'
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'teammaestro' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK to versioned filename
        if: github.event_name == 'push'
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/TeamMaestroExam-${{ github.ref_name }}.apk"

      - name: Create GitHub Release and upload APK
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: "Team Maestro Exam ${{ github.ref_name }}"
          generate_release_notes: true
          files: "app/build/outputs/apk/release/TeamMaestroExam-${{ github.ref_name }}.apk"
